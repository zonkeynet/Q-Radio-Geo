<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark light">
<!-- frame-src: live streams (YouTube without cookies, owners' players) load in a sandboxed frame only after a tap; the hosts are
     js/webcams.mjs FRAME_HOSTS (scripts/test_webcam_streams.mjs checks both). Inside Q-P1NG the app adds its own policy
     (frame-src 'none'), which this one cannot relax: nothing is framed there. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss://relay.damus.io wss://relay.primal.net wss://relay.snort.social; media-src 'self' https: blob:; worker-src 'self'; frame-src https://www.youtube-nocookie.com https://g1.ipcamlive.com https://g2.ipcamlive.com https://g3.ipcamlive.com https://ipcamlive.com https://relay.ozolio.com https://rtsp.me https://iframe.dacast.com https://api.wetmet.net https://imageserver.webcamera.pl https://webcam.elcat.kg; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Q-P1NG Globe · Global Spectrum &amp; Tactical Awareness</title>
<meta name="application-name" content="Q-P1NG Globe">
<link rel="canonical" href="https://globe.qp1ng.com/">
<meta name="robots" content="index, follow, max-image-preview:large">
<!-- Link previews: Open Graph (Facebook, LinkedIn, Telegram, Signal, WhatsApp, Discord) and X cards. Absolute URLs, so
     they also work for links to the IPFS mirrors. The image is a 1200 × 630 JPEG under 300 KB, which WhatsApp needs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Q-P1NG Globe">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Q-P1NG Globe · Global Spectrum &amp; Tactical Awareness">
<meta property="og:description" content="Global spectrum &amp; tactical awareness on a live 3D globe: news, radio, SDR, Wi-Fi, surveillance and infrastructure. No account, no ads, no trackers.">
<meta property="og:url" content="https://globe.qp1ng.com/">
<meta property="og:image" content="https://globe.qp1ng.com/assets/og.jpg">
<meta property="og:image:secure_url" content="https://globe.qp1ng.com/assets/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Q-P1NG Globe: a glowing 3D Earth with radio waves, satellites and signal icons, and the masked Q-P1NG carrier pigeon">

<meta name="twitter:image:alt" content="Q-P1NG Globe: a glowing 3D Earth with radio waves, satellites and signal icons, and the masked Q-P1NG carrier pigeon">
<!-- Search engines: what the globe is and who publishes it (a JSON data block, not a script: the policy above still applies). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Q-P1NG Globe",
  "url": "https://globe.qp1ng.com/",
  "description": "Global spectrum and tactical awareness on a live 3D globe: news, radio, SDR, Wi-Fi, surveillance and infrastructure. No account, no ads, no trackers.",
  "applicationCategory": "MultimediaApplication",
  "operatingSystem": "Any (web browser)",
  "image": "https://globe.qp1ng.com/assets/og.jpg",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
  "isPartOf": { "@type": "WebSite", "name": "Quantum P1NG", "url": "https://www.qp1ng.com/" },
  "publisher": { "@type": "Organization", "name": "ZonkeyNet", "url": "https://www.qp1ng.com/" }
}
</script>
<!-- Installable as an app -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Q-P1NG Globe">
<link rel="stylesheet" href="./assets/app.css">
<link rel="stylesheet" href="./assets/native-app.css">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<!-- PNG fallback for browsers without SVG favicons. -->
<link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192">
<!-- globe.gl 2.46.2 (MIT), bundled with the site so it also runs from mirrors; integrity-checked. -->
<script defer src="./vendor/globe.gl-2.46.2.min.js" integrity="sha384-1uolMBZ25k3zJcNwCLEv49+L+m2dZudqAzsoSAJfQTzDCSBxJzrMuZ2dkp/5JKiT" crossorigin="anonymous"></script>
<script defer src="./js/navigation.js"></script>
<!-- Service worker for fast repeat visits and offline use (on globe.qp1ng.com only; see sw.js). -->
<script defer src="./js/sw-register.js"></script>
<script type="module" src="./js/app.mjs"></script>
<!-- modulepreload: scripts/build_preload.mjs writes this list, every module js/app.mjs imports -->
<link rel="modulepreload" href="./js/catalog.mjs">
<link rel="modulepreload" href="./js/core.mjs">
<link rel="modulepreload" href="./js/aliases.mjs">
<link rel="modulepreload" href="./js/native-app.mjs">
<link rel="modulepreload" href="./js/icons.mjs">
<link rel="modulepreload" href="./js/i18n.mjs">
<link rel="modulepreload" href="./js/i18n/en.mjs">
<link rel="modulepreload" href="./js/i18n/it.mjs">
<link rel="modulepreload" href="./js/player.mjs">
<link rel="modulepreload" href="./js/qcast-player.mjs">
<link rel="modulepreload" href="./js/qcast-protocol.mjs">
<link rel="modulepreload" href="./js/qcast-crypto.mjs">
<link rel="modulepreload" href="./js/globe.mjs">
<link rel="modulepreload" href="./js/themes.mjs">
<link rel="modulepreload" href="./js/directory.mjs">
<link rel="modulepreload" href="./js/ui.mjs">
<link rel="modulepreload" href="./js/app-bridge.mjs">
<link rel="modulepreload" href="./js/sdr.mjs">
<link rel="modulepreload" href="./js/repeaters.mjs">
<link rel="modulepreload" href="./js/aviation.mjs">
<link rel="modulepreload" href="./js/morse.mjs">
<link rel="modulepreload" href="./js/maritime.mjs">
<link rel="modulepreload" href="./js/osint.mjs">
<link rel="modulepreload" href="./js/migration.mjs">
<link rel="modulepreload" href="./js/connectivity.mjs">
<link rel="modulepreload" href="./js/news.mjs">
<link rel="modulepreload" href="./js/tv.mjs">
<link rel="modulepreload" href="./js/guide.mjs">
<link rel="modulepreload" href="./js/qcast.mjs">
<link rel="modulepreload" href="./js/qcast-nostr.mjs">
<link rel="modulepreload" href="./js/webcams.mjs">
<!-- /modulepreload -->
</head><body>

    <!-- Loading: one state from the first paint until the first layer is drawn (the app hides its own on "ready"). -->
    <div id="loaderSplash" class="splash" role="status" aria-live="polite">
        <div class="splash-globe" aria-hidden="true"></div>
        <p class="splash-text" id="splashText" data-i18n="app.loadingGlobe">Loading the globe…</p>
        <div class="progress" aria-hidden="true"><i></i></div>
    </div>

    <!-- The globe is the canvas; everything else floats on it. -->
    <main id="globeViz" aria-label="Interactive globe" data-i18n-label="app.globe"></main><div id="pointTooltip" class="point-tooltip" hidden></div>
    <div class="reticle" aria-hidden="true"><i></i></div>

    <!-- A message about the whole page (no 3D, lost graphics, blocked mirror): plain words and an action. -->
    <div id="globeNotice" class="notice" role="alert" hidden></div>

    <!-- One header row: the layer button, the search, and (website) the globe tools. -->
    <header class="topbar" id="topbar">
        <a class="brand" href="./" aria-label="Q-P1NG Globe"><i class="brand-dot"></i><span>Q-P1NG <b>Globe</b></span></a>
        <div class="mode-picker">
            <button class="layer-btn" id="btnMode" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="modeMenu">
                <span id="modeIcon" class="layer-icon" aria-hidden="true"></span><span id="modeName" class="layer-name">Radio</span>
                <svg class="icon caret" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="menu layer-menu" id="modeMenu" role="menu" aria-labelledby="btnMode" hidden></div>
        </div>
        <div class="search" role="search">
            <svg class="icon search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input type="search" id="searchInput" class="search-input" enterkeyhint="search" autocomplete="off" spellcheck="false"
                role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="searchResults" aria-label="Search" placeholder="Search">
            <div id="searchResults" class="search-results" role="listbox" aria-label="Search results" hidden></div>
            <p id="searchCount" class="visually-hidden" role="status" aria-live="polite"></p>
        </div>
        <button class="tool tool-more" id="btnMore" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tools"></button>
        <div class="tools" id="tools">
            <button class="tool" id="btnTv" type="button" aria-pressed="false"></button>
            <button class="tool" id="btnAutoRotate" type="button" aria-pressed="false"></button>
            <button class="tool" id="btnTheme" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu"></button>
            <button class="tool" id="btnGuide" type="button" aria-haspopup="dialog"></button>
        </div>
        <div class="menu theme-menu" id="themeMenu" role="menu" aria-labelledby="btnTheme" hidden></div>
    </header>

    <!-- The layer's main filter as chips, and "Filters (n)" for the others. -->
    <nav class="chips" id="chipsRow" aria-label="Filters"><div class="chips-track" id="chipsTrack"></div></nav>

    <!-- Map controls: recentre on phones; zoom too on large screens. -->
    <div class="map-tools" id="mapTools">
        <button class="fab" id="btnZoomIn" type="button"></button>
        <button class="fab" id="btnZoomOut" type="button"></button>
        <button class="fab" id="btnResetView" type="button"></button>
    </div>

    <!-- The one sheet: peek, half and full on phones, a side panel in landscape and on large screens. Its list view
         shows what is around the view; its card view shows one item with the main action pinned at the bottom. -->
    <section class="sheet" id="sheet" data-sheet="half" data-view="list" aria-labelledby="sheetTitle" hidden>
        <div class="sheet-grip" id="sheetHandle" role="button" tabindex="0"><span></span></div>
        <header class="sheet-head" id="sheetHead">
            <div class="sheet-heading">
                <h2 class="sheet-title" id="sheetTitle"></h2>
                <p class="sheet-meta" id="sheetMeta"></p>
            </div>
            <button class="icon-btn" id="btnRandom" type="button"></button>
            <button class="icon-btn" id="sheetToggle" type="button" aria-expanded="true"></button>
        </header>
        <div class="sheet-status" id="sheetStatus" hidden></div>
        <div class="dir-live" id="dirLive" hidden></div>
        <div class="sheet-body" id="sheetBody">
            <div class="sheet-list" id="sheetList"></div>
            <div class="sheet-card" id="sheetCard" hidden></div>
        </div>
    </section>

    <!-- Latest stories (news), a static row on large screens. -->
    <div class="latest" id="newsTicker" hidden><span class="latest-label" id="latestLabel">Latest</span><div class="latest-track" id="tickerMove"></div></div>

    <!-- The player: only once a station is chosen. A mini-player above the sheet; expands for the stations of the place. -->
    <footer class="player" id="bottomPlayer" hidden>
        <div class="player-row">
            <button class="play-btn" id="btnPlayPause" type="button"></button>
            <div class="station-meta">
                <p class="station-title" id="playerTitle"></p>
                <p class="station-line"><span id="playerCity"></span><span id="playerCountry"></span><span class="station-tech" id="playerTech"></span></p>
            </div>
            <span class="status-badge" id="playerStatus"><i class="status-dot"></i><span id="playerStatusText" role="status" aria-live="polite"></span></span>
            <span id="playbackIndicator" class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
            <button class="icon-btn" id="btnPlayerSize" type="button" aria-expanded="false"></button>
        </div>
        <div class="player-more" id="playerMore">
            <div class="player-controls">
                <button class="icon-btn" id="btnPrevStation" type="button"></button>
                <button class="icon-btn" id="btnNextStation" type="button"></button>
                <label class="volume"><span class="visually-hidden" id="volumeLabel">Volume</span><input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8"></label>
                <a class="icon-btn" id="btnExternal" hidden target="_blank" rel="noopener noreferrer"></a>
                <button class="icon-btn" id="btnShareStation" type="button" hidden></button>
                <button class="icon-btn" id="btnRevokeAudio" type="button" hidden></button>
            </div>
            <p id="playerDetail" class="player-detail"></p>
            <div class="stations-drawer" id="cityStationsDrawer" hidden></div>
        </div>
    </footer>

    <!-- One consent for media from third-party servers (website): asked once, before the first connection. -->
    <dialog class="sheet-dialog consent" id="audioConsent" aria-labelledby="consentTitle">
        <h2 id="consentTitle">Play from the station's server?</h2>
        <p id="consentText"></p>
        <div class="dialog-actions">
            <button class="btn btn-tonal" id="btnDeclineAudio" type="button">Not now</button>
            <button class="btn btn-filled" id="btnAcceptAudio" type="button">Allow and play</button>
        </div>
    </dialog>

    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

    <!-- Audio Element Hidden -->
    <div id="audioHolder" hidden></div>

</body></html>
